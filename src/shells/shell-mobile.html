<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移动端原型</title>
  <style>
/* __BASE_CSS__ placeholder */
  </style>
  <style>
    /* ===== 手机壳：全面屏 · 居中展示 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #EFEAE0;
      display: flex; align-items: center; justify-content: center;
      padding: 12px; min-height: 100vh;
    }
    /* 手机壳：默认小米17比例 2656:1220 ≈ 1:2.177（360 × 783.6），项目可覆盖 */
    .mobile-shell {
      width: 360px; height: 783.6px;
      background: #1C1C1E; border-radius: 44px; padding: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      display: flex; flex-direction: column; position: relative;
      transform-origin: center center;
    }
    .mobile-screen {
      flex: 1; min-height: 0; background: #fff; border-radius: 36px; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
    }
    /* 桌面预览：视口不够高时等比缩小（不影响移动端原型比例） */
    @media (max-height: 830px) {
      .mobile-shell { zoom: 0.9; }
    }
    @media (max-height: 750px) {
      .mobile-shell { zoom: 0.82; }
    }
    @media (max-height: 680px) {
      .mobile-shell { zoom: 0.72; }
    }
    /* 状态栏（全面屏 · 仿真信号区） */
    .status-bar {
      height: 46px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; flex-shrink: 0; z-index: 5;
      background: transparent;
    }
    .status-bar .sb-left {
      font-size: 15px; font-weight: 600; color: #1a1a1a; letter-spacing: 0.5px;
    }
    .status-bar .sb-right { display: flex; align-items: center; gap: 7px; }
    .status-bar svg { display: block; }
    .app-root { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
    .app-root::-webkit-scrollbar { display: none; }
    /* 全面屏底部横条（安卓手势条） */
    .home-indicator {
      height: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      background: transparent;
    }
    .home-indicator::after {
      content: ''; width: 110px; height: 4px; border-radius: 4px;
      background: rgba(0,0,0,0.22);
    }
    /* 底部 Tab（项目通过 tabBar 配置注入） */
    .tab-bar {
      height: 52px; border-top: 1px solid #f0f0f0; display: flex;
      background: #fff; flex-shrink: 0;
    }
    .tab-bar-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-size: 10px; color: #999;
      cursor: pointer; text-decoration: none; gap: 2px;
    }
    .tab-bar-item.active { color: {{PRIMARY_COLOR}}; }
    .tab-bar-item .tab-icon { font-size: 20px; line-height: 1; }
    /* 页面容器：flex 纵向布局，壳内滚动（页面组件自带业务样式时按需覆盖） */
    .page { display: none; height: 100%; background: #fff; }
    .page.active { display: flex; flex-direction: column; }
    .page-body { flex: 1; overflow-y: auto; min-height: 0; }
    .page-body::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div class="mobile-shell">
    <div class="mobile-screen">
      <div class="status-bar">
        <span class="sb-left">10:24</span>
        <span class="sb-right">
          <!-- 信号 -->
          <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
            <rect x="0" y="7" width="3" height="4" rx="0.8" fill="#1a1a1a"/>
            <rect x="4.6" y="5" width="3" height="6" rx="0.8" fill="#1a1a1a"/>
            <rect x="9.2" y="2.5" width="3" height="8.5" rx="0.8" fill="#1a1a1a"/>
            <rect x="13.8" y="0" width="3" height="11" rx="0.8" fill="#1a1a1a" opacity="0.25"/>
          </svg>
          <!-- WiFi -->
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
            <path d="M1.2 3.4a9.4 9.4 0 0112.6 0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M3.6 5.9a5.9 5.9 0 017.8 0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="7.5" cy="9" r="1.6" fill="#1a1a1a"/>
          </svg>
          <!-- 电池 -->
          <svg width="24" height="12" viewBox="0 0 24 12" fill="none">
            <rect x="0.5" y="0.5" width="20" height="11" rx="3" stroke="#1a1a1a" stroke-width="1"/>
            <rect x="2" y="2" width="14.5" height="8" rx="1.6" fill="#1a1a1a"/>
            <path d="M22.5 4v4a2 2 0 000-4z" fill="#1a1a1a"/>
          </svg>
        </span>
      </div>
      <div class="app-root" id="app-root">
        <!-- 组件 page div 注入处 -->
      </div>
      <nav class="tab-bar" id="tab-bar">
        <!-- build.py 根据 config.json 生成 -->
      </nav>
      <div class="home-indicator"></div>
    </div>
  </div>

  <script>
/* __MOCK_DATA__ placeholder */
  </script>
  <script>
/* __COMPONENT_SCRIPTS__ placeholder */
  </script>
  <script>
/* __BASE_JS__ placeholder */
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      window.PLATFORM = 'mobile';
      ProtoRouter.init('m-home');
    });
  </script>
</body>
</html>
