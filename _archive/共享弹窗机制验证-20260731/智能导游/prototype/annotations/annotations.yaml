version: '1.0'
items:
  test-01:
    type: "button"
    title: "用户详情（共享弹窗标注验证）"
    content: |
      ### 功能
      打开用户详情弹窗（共享弹窗容器机制验证用标注）。
      
      ### 交互与规则
      1. 点击后打开 userDetailModal 共享弹窗
      2. 该弹窗由 pages/_shared.html 提供，不参与页面切换
      
  test-02:
    type: "button"
    title: "知识详情（共享弹窗标注验证）"
    content: |
      ### 功能
      打开知识详情弹窗（标注兼容性验证用标注）。
      
      ### 交互与规则
      1. 点击后打开 kbDetailModal 弹窗
      2. 验证标注系统与弹窗触发按钮兼容
      
  kb-page:
    type: "page"
    title: "知识库管理"
    content: |
      ### 功能
      管理知识库及其下属问答和文档的增删改查，与未命中问题统计双向打通。
      
      ### 初始化
      进入页面默认加载知识条目列表，支持按来源客户、来源场馆、内容类型、来源方式、状态进行筛选。
      
      ### 权限
      仅管理员可访问。离开页面无特殊确认。
      
  kb-01:
    type: "button"
    title: "新增问答"
    content: |
      ### 功能
      打开新增问答弹窗，创建一条 FAQ 知识。
      
      ### 交互与规则
      1. 点击后打开新增问答弹窗，标题为「新增问答」
      2. 弹窗组件与编辑复用（参见 kb-form）
      
  kb-02:
    type: "button"
    title: "上传文档"
    content: |
      ### 功能
      打开上传文档弹窗，上传资料文件。
      
      ### 交互与规则
      1. 支持 PDF / DOCX / TXT / MD 格式，单文件不超过 20MB
      2. 支持批量上传，单次最多20个文件，批量上传的文件，每个文件会单独生成一条数据
      
  kb-03:
    type: "button"
    title: "批量导入问答"
    content: |
      **（二期功能）**
      
      ### 功能
      下载批量导入问答的 Excel 模板。
      
      ### 交互与规则
      1. 点击后触发模板下载，显示「批量导入模板下载中…」提示
      2. 一期按钮仅做占位，实际导入功能二期实现
      
  kb-04:
    type: "list"
    title: "知识条目列表"
    content: |
      ### 数据展示
      1、列表字段包括：内容类型、标题/问题、内容摘要、相似问法、所属客户、所属场馆、来源、状态、近 30 天命中、创建人/时间、操作。
      2、按创建时间倒序排列。
      
      ### 筛选与分页
      1、数据来自知识条目接口，支持按来源客户、来源场馆、内容类型、来源方式、状态进行筛选（条件之间为 AND 逻辑，实时筛选）。
      2、分页器支持每页 10 / 20 / 50 条切换，切换分页不丢失筛选条件。
      3、空状态显示「暂无知识内容，去新增问答或上传文档」。
      
      ### 字段说明
      1、内容摘要
      （1）问答类型：显示问题的答案
      （2）问答类型：显示文档的大小及切片数量
      （3）解析失败的数据不显示内容摘要
      2、状态：
      （1）人工新增：人工通过“新增问答”方式增加的数据
      （2）资料导入：通过“上传文档”方式上传的数据
      （3）未命中问题转入：在【未命中问题统计】页面，通过“补充知识库”方式进入数据库的数据
      3、近30天命中：知识在近30天内被问答引用的次数
      
      ### 刷新规则
      新增、编辑、删除操作后自动刷新当前页。来源字段为纯文字展示，不可点击。
      
  kb-05:
    type: "button"
    title: "导出"
    content: |
      **（二期功能）**
      
      ### 功能
      导出知识库数据。
      
      ### 交互与规则
      1. 点击后打开导出弹窗
      2. 一期不做，二期实现
      
  kb-06:
    type: "list"
    title: "列表字段说明"
    content: |
      ### 字段展示说明
      与 kb-04 为同一列表的不同视角：kb-04 定义数据来源，kb-06 定义字段展示。
      
      ### 展示规则
      1. 内容类型列：问答显示蓝底标签，文档显示紫底标签
      2. 相似问法列：显示数量，数字可点击查看
      3. 近 30 天命中列：数字可点击查看命中详情
      4. 创建人/时间列：显示创建人，换行显示时间
      
  kb-07:
    type: "button"
    title: "操作列"
    content: |
      ### 功能
      每行知识条目的操作入口，统一为「详情」+「更多 ▾」两个按钮。
      
      ### 交互与规则
      1. 根据内容类型动态显示菜单项
      2. 点击「详情」打开知识详情弹窗（参见 kb-detail）
      3. 点击「更多」展开下拉菜单（参见 kb-more-menu）
      4. 点击页面其他区域自动收起菜单
      5. 点击“编辑”并保存后，重新触发解析
      
      ### 菜单项规则
      - 问答类型：详情、编辑、重新解析（仅解析失败时显示）、删除
      - 文档类型：详情、下载、重新解析（仅解析失败时显示）、删除
      
  kb-detail:
    type: "modal"
    title: "知识详情弹窗"
    content: |
      ### 功能
      查看知识条目的完整详情，纯查看无确认操作。
      
      ### 打开方式
      点击操作列「详情」按钮打开。
      
      ### 内容展示
      根据内容类型（问答/文档）渲染不同模板，数据来自知识条目详情接口。
      
      ### 问答类型展示
      1. 顶部：类型标签、标题、状态、所属客户/场馆、创建人/时间、最近编辑/时间、近 30 天命中
      2. 内容区：标准问题、相似问法列表（带数量）、答案内容
      3. 底部：知识来源折叠区（只读，展示原始未命中问题记录，含转入/合并标记）
      4. 操作：编辑按钮（打开编辑弹窗）
      
      ### 文档类型展示
      1. 顶部：类型标签、文件名、状态、所属客户/场馆、上传人/时间、文件格式/大小、近 30 天命中
      2. 操作：下载原文件、重新解析、关闭（无预览功能）
      3. 解析失败状态显示红色错误提示条
      
  kb-form:
    type: "modal"
    title: "新增/编辑问答弹窗"
    content: |
      ### 功能
      新增或编辑问答知识的表单弹窗。三处入口复用同一弹窗组件：新增问答按钮、操作列「编辑」、未命中问题统计跳转。
      
      ### 打开方式
      1. 新增模式：空表单
      2. 编辑模式：预填当前行数据
      3. 跳转入口：预填客户、场馆、标准问题
      
      ### 表单字段
      1. 所属客户（必填，下拉选择）
      2. 所属场馆（必填，下拉选择）
      3. 标准问题（必填）
      4. 相似问法（选填，每行一条）
      5. 答案内容（必填）
      
      ### 确认与关闭
      1. 点击确认：校验必填项 → 调用保存接口 → 状态变为解析中 → 关闭弹窗并刷新列表
      2. 点击取消或关闭：直接关闭弹窗，不保存，不弹二次确认
      
  venue-page:
    type: "page"
    title: "场馆管理"
    content: |
      ### 功能
      管理场馆及其二维码、智能体、知识库配置。
      
      ### 初始化
      进入页面默认显示「场馆列表」TAB，加载场馆数据。TAB 切换不丢失筛选条件。
      
      ### 权限
      仅管理员可访问。离开页面无特殊确认。
      
  venue-01:
    type: "button"
    title: "新增场馆"
    content: |
      ### 功能
      打开新增场馆弹窗。
      
      ### 表单字段
      所属客户（必填）、场馆名称（必填）、场馆logo、状态、智能体、知识库、备注。
      
      ###字段说明
      1、智能体：浏览框，可以选择dify已创建的智能体
      2、知识库：浏览框，选择dify平台对应场馆的专属知识库
      3、数据来源：智能体、知识库这两个字段数据内容都是来自于dify，通过接口动态获取数据，数据维护也是在dify
      
      ###特殊逻辑
      1、二维码：新建场馆后自动生成二维码，如果有场馆logo，则生成的二维码中心带logo
  venue-02:
    type: "list"
    title: "筛选模块"
    content: |
      ### 数据展示
      筛选模块，支持对场馆列表进行条件筛选。按创建时间倒序排列。
      
      ### 筛选与分页
      筛选条件：所属客户（下拉）、场馆名称（下拉，联动客户）、状态（启用/停用）。条件之间为 AND 逻辑。分页器支持每页 10 / 20 / 50 条。空状态显示「暂无场馆数据」。
      
      ### 联动规则
      选择客户后联动更新场馆名称下拉选项。重置按钮清空所有筛选条件。
      
      ### 刷新规则
      新增、编辑、删除、启停操作后自动刷新。
      
  venue-03:
    type: "list"
    title: "场馆列表"
    content: |
      ### 数据展示
      列表字段：所属客户、场馆名称、二维码（缩略图）、扫码次数、智能体、知识库、状态、创建时间、操作。
      数据按创建时间倒序排列。
      
      ### 特殊展示
      1、二维码缩略图点击打开预览弹窗（参见 venue-qr）
      
      ### 筛选与分页
      同 venue-02 筛选模块。
      空状态显示「暂无场馆，去新增场馆」。
      
  venue-04:
    type: "button"
    title: "导出"
    content: |
      **（二期功能）**
      
      ### 功能
      导出场馆数据。
      
      ### 交互与规则
      1. 点击后打开导出弹窗
      2. 一期不做，二期实现
      
  venue-05:
    type: "button"
    title: "操作列"
    content: |
      ### 功能
      每行场馆数据的操作按钮组。
      
      ### 交互与规则
      1. 根据状态渲染不同按钮文案
      2. 点击「详情」打开场馆详情弹窗（参见 venue-detail）
      3. 点击「编辑」打开编辑弹窗并预填数据（参见 venue-edit）
      4. 停用需二次确认，启用直接执行
      5. 删除需二次确认，删除后数据完全移除、不可恢复
      
      ### 按钮状态
      - 启用状态：显示「详情」「编辑」「停用」「删除」
      - 停用状态：显示「详情」「编辑」「启用」「删除」（停用按钮文案变为「启用」，点击直接执行）
      
  venue-06:
    type: "list"
    title: "公共知识库列表"
    content: |
      ### 数据展示
      公共知识库配置列表，字段包括：客户 ID、客户名称、公共知识库 ID、知识库 API Key、更新时间、操作。按客户名排序，全量展示无分页。
      
      ### 操作列
      编辑、测试连接、删除。新增、编辑、删除后自动刷新。空状态显示「暂无配置」。
      
      ### 交互与规则
      1. 点击「编辑」打开编辑弹窗并预填数据
      2. 点击「测试连接」调用验证接口，超时 10 秒提示失败
      3. 点击「删除」需二次确认
      
  venue-07:
    type: "button"
    title: "新增配置"
    content: |
      ### 功能
      打开新增公共知识库配置弹窗。
      
      ### 表单字段
      1. 客户 ID（下拉选择，必填）
      2. 客户名称（选择客户后自动填充，只读）
      3. 公共知识库 ID（必填）
      4. 知识库 API Key（选填）
      
  venue-detail:
    type: "modal"
    title: "场馆详情弹窗"
    content: |
      ### 功能
      查看场馆完整详情，纯查看无确认操作。
      
      ### 打开方式
      点击操作列「详情」按钮打开。
      
      ### 内容展示
      展示所属客户、场馆名称、状态、智能体、创建时间、备注、二维码预览缩略图（大图）、扫码次数和最近扫码时间。
      
  venue-edit:
    type: "modal"
    title: "编辑场馆弹窗"
    content: |
      ### 功能
      编辑场馆信息的表单弹窗。
      
      ### 打开方式
      点击操作列「编辑」按钮打开，预填当前场馆数据。
      
      ### 表单规则
      场馆名称为必填项。
      
      ### 确认与关闭
      1. 点击确认：校验必填项 → 调用保存接口 → 成功后关闭弹窗并刷新列表，显示成功提示
      2. 点击取消：关闭弹窗，不保存
      
  venue-qr:
    type: "modal"
    title: "二维码预览弹窗"
    content: |
      ### 功能
      预览场馆二维码的大图。
      
      ### 打开方式
      点击列表中二维码缩略图打开。
      
      ### 内容展示
      展示二维码图案和场馆名称。
      
      ### 操作
      1. 下载按钮触发二维码下载
      2. 复制链接按钮复制二维码链接
      
  venue-disable:
    type: "modal"
    title: "停用/删除确认弹窗"
    content: |
      ### 功能
      停用或删除场馆的确认弹窗。停用和删除共用同一弹窗结构，文案不同。
      
      ### 打开方式
      点击操作列「停用」或「删除」按钮打开。
      
      ### 确认与关闭
      1. 点击确认：
         - 停用：调用停用接口，停用后二维码无法扫码进入 AI 导游
         - 删除：调用删除接口，数据完全移除，二维码立即失效，历史会话数据保留
      2. 点击取消：关闭弹窗，不执行任何操作
      3. 确认后列表自动刷新
      
  venue-status:
    type: "state"
    title: "场馆状态"
    content: |
      ### 状态说明
      - 启用：可操作「详情」「编辑」「停用」「删除」
      - 停用：可操作「详情」「编辑」「启用」「删除」
      
      ### 流转规则
      1. 启用 → 停用：点击停用按钮 → 二次确认 → 调用停用接口
      2. 停用 → 启用：点击启用按钮 → 直接调用启用接口
      3. 停用状态下按钮文案变为「启用」，启用状态下按钮文案为「停用」
      
  venue-qr-status:
    type: "state"
    title: "二维码生成状态"
    content: |
      ### 状态说明
      - 已生成：显示二维码缩略图，可点击预览
      - 未生成：显示灰色「未生成」文字
      
      ### 流转规则
      1. 未生成 → 已生成：新增场馆保存后自动生成二维码
      
  venue-customer-linkage:
    type: "linkage"
    title: "客户→场馆联动"
    content: |
      ### 联动规则
      当筛选栏「所属客户」下拉值变化时，「场馆名称」下拉选项自动更新为该客户名下的场馆列表。未选客户时显示全部场馆。筛选模块和导出弹窗都需实现此联动。
      
  venue-pubkb-customer-linkage:
    type: "linkage"
    title: "公共知识库配置-客户联动"
    content: |
      ### 联动规则
      在新增/编辑公共知识库配置弹窗中，选择「客户 ID」下拉后，「客户名称」输入框自动填充为对应的客户名称，且该字段为只读。
      
  miss-page:
    type: "page"
    title: "未命中问题统计"
    content: |
      ### 功能
      汇总所有触发兜底回复的问题，支持列表视图，驱动知识库补充决策。
      
      ### 初始化
      进入页面默认显示原始列表视图，加载未命中问题数据。筛选条件跨视图保持。
      
      ### 权限
      仅管理员可访问。离开页面无特殊确认。
      
  miss-01:
    type: "list"
    title: "筛选模块"
    content: |
      ### 数据展示
      筛选模块，支持对未命中问题进行条件筛选。按触发时间倒序排列。
      
      ### 筛选与分页
      1、数据来自未命中问题接口。
      2、筛选条件：来源客户、来源场馆（联动客户）、时间范围（日期区间）、处理状态（四选一）。
      3、条件之间为 AND 逻辑。
      4、分页器支持每页 10 / 20 / 50 条。
      5、空状态显示「暂无未命中问题」。
      
      ### 联动规则
      选择客户后联动更新场馆下拉。重置按钮清空所有筛选条件。处理后自动刷新。
  miss-02:
    type: "linkage"
    title: "视图切换"
    content: |
      **（二期功能）**
      
      **（待确认）**
      
      ### 联动规则
      通过分组/列表按钮切换两个视图容器，按钮高亮同步。分组视图为后续规划，当前不可用。
      
  miss-03:
    type: "list"
    title: "分组视图"
    content: |
      **（二期功能）**
      
      **（待确认）**
      
      ### 数据展示
      分组视图，数据来自分组接口。按最近触发时间倒序排列，全量展示无分页。
      
      ### 筛选与分页
      筛选条件同 miss-01。空状态显示「暂无分组」。处理后自动刷新。
      
      ### 交互与规则
      1. 行可点击进入分组详情弹窗（参见 miss-group-detail）
      2. 操作列正确显示待处理/已处理/已忽略状态
      3. 展示 AI 分类结果
      
      ### 备注
      分组视图为后续规划，当前不可用。
      
  miss-04:
    type: "list"
    title: "原始列表"
    content: |
      ### 数据展示
      原始列表视图，数据来自未命中问题接口。按触发时间倒序排列。
      
      ### 筛选与分页
      筛选条件同 miss-01。空状态显示「暂无未命中问题」。支持搜索。
      
      ### 操作列规则
      1. 待处理状态：显示「详情」「补充知识库」「合并至已有」「忽略」四个按钮
      2. 已处理状态：显示 「详情」「已补充知识库」--点击已补充知识库可跳转到对应的知识详情页。如果只是已删除，则「已补充知识库」不可点击
      3. 已忽略状态：显示「详情」
      4、「合并至已有」--【一期不做，二期再做】
      
  miss-group-detail:
    type: "modal"
    title: "分组详情弹窗"
    content: |
      **（二期功能）**
      
      **（待确认）**
      
      ### 功能
      查看未命中问题分组的详情。
      
      ### 打开方式
      在分组视图中点击行打开。
      
      ### 内容展示
      展示分组元信息，表格展示每条问题。支持待处理问题标记和批量操作。
      
      ### 备注
      分组视图为后续规划，当前不可用。
      
  miss-export-modal:
    type: "modal"
    title: "导出弹窗"
    content: |
      ### 功能
      导出未命中问题数据的配置弹窗。
      
      ### 打开方式
      点击导出按钮打开。
      
      ### 确认与关闭
      1. 点击确认：按选定条件导出 Excel 文件，显示成功提示
      2. 点击取消：关闭弹窗
      3. 支持按客户、处理状态进行筛选
      
  miss-join-kb:
    type: "button"
    title: "补充知识库"
    content: |
      ### 功能
      将未命中问题补充到知识库，创建新的 FAQ 条目。
      
      ### 交互与规则
      1. 点击后跳转到知识库管理页，自动打开新增问答弹窗
      2. 预填客户、场馆、标准问题三个字段，相似问法和答案留空
      3. 提交后该问题状态变为「已处理」
      
  miss-merge:
    type: "button"
    title: "合并至已有"
    content: |
      ### 【一期不做，二期再做】
      ### 功能
      将未命中问题合并到已有知识库条目中。
      
      ### 交互与规则
      1. 点击后打开合并弹窗（参见 merge-modal）
      2. 自动传递问题原文、客户、场馆信息
      
  miss-ignore:
    type: "button"
    title: "忽略"
    content: |
      ### 功能
      直接将未命中问题的“处理状态”标记为已忽略，无二次确认。
      
      ### 交互与规则
      1. 点击后直接调用忽略接口
      2. 操作完成后列表自动刷新
      
  miss-status:
    type: "state"
    title: "处理状态"
    content: |
      ### 状态说明
      - 待处理：可操作「补充知识库」「合并至已有」「忽略」
      - 已处理：可操作「查看」
      - 已忽略：无操作
      
      ### 流转规则
      1. 待处理 → 已处理：补充知识库或合并操作成功后自动流转
      2. 待处理 → 已忽略：点击忽略后直接流转
      3. 已处理、已忽略均为终态，不可回退
      
  miss-process-method:
    type: "state"
    title: "处理方式"
    content: |
      ### 状态说明
      - 已补充知识库：处理方式为补充新知识，显示文字 + 「查看」按钮
      - 已合并知识库：处理方式为合并到已有知识，显示文字 + 「查看」按钮
      
  miss-view-linked:
    type: "button"
    title: "查看关联知识"
    content: |
      ### 功能
      查看与未命中问题关联的知识库条目详情。
      
      ### 交互与规则
      1. 点击后调用接口获取关联知识条目数据，打开知识详情弹窗展示最新内容
      2. 已删除的关联知识条目显示灰色不可点击
      
  merge-modal:
    type: "modal"
    title: "合并至已有知识弹窗"
    content: |
      ### 功能
      将未命中问题合并到已有知识条目的弹窗。
      
      ### 打开方式
      点击「合并至已有」按钮打开，自动展示问题原文和所属范围。
      
      ### 布局
      1. 顶部：问题原文 + 所属范围
      2. 中部：搜索框 + 搜索结果列表（单选）
      3. 底部：取消 / 确认按钮
      
      ### 交互规则
      1. 搜索支持防抖（300ms），实时检索已有知识条目
      2. 结果列表为单选（Radio）
      3. 无搜索结果时显示提示
      4. 未选择目标时点击确认显示提示
      5. 合并成功后显示成功提示，问题状态变为「已处理」
      
      ### 确认与关闭
      1. 点击确认：调用合并接口 → 追加相似问法 → 重新向量化 → 关闭弹窗 → 刷新列表
      2. 点击取消：关闭弹窗
      
  miss-customer-linkage:
    type: "linkage"
    title: "客户→场馆联动"
    content: |
      ### 联动规则
      选择「来源客户」下拉后，「来源场馆」下拉选项自动更新为该客户名下的场馆列表。清空客户后恢复全部场馆选项。
      
  miss-ai-classification:
    type: "computed"
    title: "AI分类结果"
    content: |
      **（待确认）**
      
      ### 计算规则
      AI 自动判断未命中问题的分类，基于问题内容和知识库匹配情况。分类结果在分组视图中展示，用于决定操作建议。
      
      ### 更新时机
      新问题进入时自动触发分类。
      
      ### 约束
      不可人工修改，可通过忽略操作处理。分类规则需开发确认。
      
  user-page:
    type: "page"
    title: "用户管理"
    content: |
      ### 功能
      管理小程序注册用户的访问数据与状态。
      
      ### 初始化
      进入页面默认加载用户列表，支持按相关客户、状态、注册时间范围进行筛选。
      
      ### 权限
      仅管理员可访问。离开页面无特殊确认。
      
  user-01:
    type: "list"
    title: "筛选模块"
    content: |
      ### 数据展示
      筛选模块，支持对用户列表进行条件筛选。按注册时间倒序排列。
      
      ### 筛选与分页
      数据来自用户接口。
      筛选条件：相关客户（下拉）、状态（全部/正常/已禁用）、注册时间范围（日期区间）。
      条件之间为 AND 逻辑。
      空状态显示「暂无用户数据」。
      
      ### 刷新规则
      -禁用、启用操作后自动刷新。
      -重置按钮清空所有筛选条件。
      
  user-02:
    type: "list"
    title: "用户列表"
    content: |
      ### 数据展示
      列表字段：手机号、昵称、相关客户、总会话、最近访问、注册时间、状态、操作。按注册时间倒序排列。
      
      ### 特殊展示
      1. 手机号为蓝色可点击，点击打开用户详情弹窗
      2. 相关客户以标签展示，最多显示 2 个 +「+N」
      
      ### 操作列
      详情按钮 + 禁用/启用按钮（根据状态切换）。
      
      ### 数据来源
      用户通过小程序扫码注册，需要补充注册接口，传递相关字段
  user-03:
    type: "button"
    title: "导出"
    content: |
      **（二期功能）**
      
      ### 功能
      导出用户数据。
      
      ### 交互与规则
      1. 点击后打开导出弹窗
      2. 一期不做，二期实现
      
  user-04:
    type: "button"
    title: "操作列"
    content: |
      ### 功能
      每行用户数据的操作按钮组。
      
      ### 交互与规则
      1. 根据状态渲染不同按钮
      2. 点击「详情」打开用户详情弹窗（参见 user-detail）
      3. 禁用需二次确认，启用直接执行
      4. 禁用后按钮文案变为「启用」
      
      ### 按钮状态
      - 正常状态：显示「详情」+ 红色「禁用」按钮
      - 已禁用状态：显示「详情」+ 绿色「启用」按钮
      
  user-detail:
    type: "modal"
    title: "用户详情弹窗"
    content: |
      ### 功能
      查看用户完整详情，纯查看无确认操作。
      
      ### 打开方式
      点击操作列「详情」按钮或点击手机号打开。
      
      ### 布局
      三个 Tab：基本信息 / 关联场馆 / 会话记录。基本信息在上，关联场馆和会话记录在下。
      
      ### 基本信息
      手机号、昵称、访问客户数、总会话数、累计兜底次数（颜色分级）、最近活跃、注册时间、状态。
      
      ### 关联场馆表格
      客户名称、场馆名称、首次/最近到访、总会话次数。
      
      ### 会话记录表格
      时间、客户/场馆、消息轮次、兜底次数、质量标签、操作。「查看详情」跳转会话记录页。
      
  user-disable:
    type: "modal"
    title: "禁用确认弹窗"
    content: |
      ### 功能
      禁用用户账号的确认弹窗。
      
      ### 打开方式
      点击操作列「禁用」按钮打开。
      
      ### 确认与关闭
      1. 点击确认：调用禁用接口，成功后用户状态变为「已禁用」，显示成功提示
      2. 点击取消：关闭弹窗，不执行任何操作
      
  user-status:
    type: "state"
    title: "用户状态"
    content: |
      ### 状态说明
      - 正常：可操作「详情」「禁用」
      - 已禁用：可操作「详情」「启用」
      
      ### 流转规则
      1. 正常 → 已禁用：点击禁用按钮 → 二次确认 → 调用禁用接口
      2. 已禁用 → 正常：点击启用按钮 → 直接调用启用接口
      
      ### 展示规则
      正常状态显示绿色标签，已禁用显示红色标签。
      
  user-customer-linkage:
    type: "linkage"
    title: "客户→详情Tab联动"
    content: |
      ### 联动规则
      在用户详情弹窗中，当用户有多个关联客户时，关联场馆 Tab 内容根据选中的客户进行筛选，展示该客户下的场馆数据。
      
  user-export-modal:
    type: "modal"
    title: "导出弹窗"
    content: |
      **（二期功能）**
      
      ### 功能
      导出用户数据的配置弹窗。
      
      ### 打开方式
      点击导出按钮打开。
      
      ### 确认与关闭
      1. 点击确认：按选定条件导出 Excel 文件，显示成功提示
      2. 点击取消：关闭弹窗
      3. 支持按客户、状态、时间范围进行筛选
      
      ### 备注
      一期不做，二期实现。
      
  log-page:
    type: "page"
    title: "会话记录"
    content: |
      ### 功能
      监控所有用户的会话数据，查看对话详情。
      
      ### 初始化
      进入页面默认加载会话列表，支持按客户、场馆、用户、时间、质量进行筛选。
      
      ### 权限
      仅管理员可访问。离开页面无特殊确认。
      
  log-01:
    type: "list"
    title: "筛选模块"
    content: |
      ### 数据展示
      筛选模块，支持对会话记录进行条件筛选。按开始时间倒序排列。
      
      ### 筛选与分页
      1、数据来自会话接口。
      2、筛选条件：来源客户（下拉，联动场馆）、来源场馆（下拉）、用户（手机号/昵称搜索）、时间范围（日期区间）、会话质量（全部/优质/一般/需关注）。
      3、条件之间为 AND 逻辑。
      4、分页器支持每页 10 / 20 / 50 条。空状态显示「暂无会话记录」。
      
      ### 联动规则
      选择客户后联动更新场馆下拉。重置按钮清空所有筛选条件。会话记录为只读数据，无刷新操作。
      
  log-02:
    type: "list"
    title: "会话记录列表"
    content: |
      ### 数据展示
      列表字段：会话 ID、用户、来源客户、来源场馆、智能体、开始时间、消息轮次、兜底次数、会话质量、操作。按开始时间倒序排列。
      
      ### 特殊展示
      1. 消息轮次和质量列带「?」图标 tooltip 说明
      2. 兜底次数 > 0 显示黄色高亮，= 0 显示绿色
      3. 质量标签：优质 = 蓝绿色、一般 = 黄色、需关注 = 红色
      
      ### 操作列
      详情按钮，点击打开会话详情弹窗。
      
      ### 筛选与分页
      同 log-01 筛选模块。空状态显示「暂无会话记录」。
      
  log-04:
    type: "button"
    title: "导出"
    content: |
      **（二期功能）**
      
      ### 功能
      导出会话记录。
      
      ### 交互与规则
      1. 点击后打开导出弹窗
      2. 一期不做，二期实现
      
  log-detail:
    type: "modal"
    title: "会话详情弹窗"
    content: |
      ### 功能
      查看会话的完整对话记录，纯查看无确认操作。
      
      ### 打开方式
      点击操作列「详情」按钮打开。
      
      ### 布局
      1. 顶部元信息：用户、客户/场馆、开始时间、消息轮次、兜底次数
      2. 下方为对话气泡区域，可滚动浏览
      
      ### 对话展示规则
      1. 用户对话显示在右侧，蓝色气泡
      2. AI 对话显示在左侧，白色气泡
      3. 每条消息带时间戳
      4. 兜底回复显示兜底话术
      
  log-export-modal:
    type: "modal"
    title: "导出会话记录弹窗"
    content: |
      **（二期功能）**
      
      ### 功能
      导出会话记录的配置弹窗。
      
      ### 打开方式
      点击导出按钮打开。
      
      ### 确认与关闭
      1. 点击确认：按选定条件导出 Excel 文件，显示成功提示
      2. 点击取消：关闭弹窗
      3. 支持按客户、会话质量进行筛选
      
      ### 备注
      一期不做，二期实现。
      
  log-quality:
    type: "state"
    title: "会话质量"
    content: |
      ### 状态说明
      - 优质：兜底次数 = 0，显示蓝绿色标签
      - 一般：兜底次数 1~3，显示黄色标签
      - 需关注：兜底次数 > 3，显示红色标签
      
      ### 计算规则
      会话质量由系统根据兜底次数自动计算，不可手动修改。所有状态均可查看会话详情。
      
  log-customer-linkage:
    type: "linkage"
    title: "客户→场馆联动"
    content: |
      ### 联动规则
      当筛选栏「来源客户」下拉值变化时，「来源场馆」下拉选项自动更新为该客户名下的场馆列表。清空客户后恢复全部场馆选项。
      
  anno-01:
    type: "button"
    title: "新建标注"
    content: |
      待填写
  anno-02:
    type: "page"
    title: "分组视图"
    content: |
      ### 功能说明
      1、展示AI分类之后的未命中问题统计列表，辅助运营人员对问题进行处理。
      2、一期不做，二期功能。
  miss-export:
    type: "button"
    title: "导出"
    content: |
      ### 功能
      导出未命中问题数据。
      
      ### 交互与规则
      1. 点击后打开导出弹窗（参见 miss-export-modal）
      2. 支持按客户、处理状态进行筛选
      3. 一期不做，二期实现
      