function renderKbTable(data) {
  const list = data || kbData;
  const tbody = document.getElementById('kbTableBody');
  tbody.innerHTML = list.map((item, i) => {
    const realIdx = kbData.indexOf(item);
    const isFaq = item.type === 'faq';
    const typeBadge = isFaq
      ? '<span class="badge-status" style="background:#e6f7ff;color:#0B5DEA;border:1px solid #91d5ff;">问答</span>'
      : '<span class="badge-status" style="background:#f9f0ff;color:#722ed1;border:1px solid #d3adf7;">文档</span>';
    const title = isFaq ? item.standardQuestion : item.documentName;
    const summary = isFaq ? (item.answer ? item.answer.substring(0, 30) + '...' : '—') : (item.fileSize + ' · ' + item.chunkCount + '段');
    const similarCount = isFaq ? '<span style="color:#0B5DEA;cursor:pointer;font-weight:500;">+' + item.similarQuestions.length + '</span>' : '<span style="color:#999;">—</span>';
    const statusMap = {
      '解析中': '<span class="badge-status" style="background:#f5f5f5;color:#999;border:1px solid #e8e8e8;">解析中</span>',
      '已生效': '<span class="badge-status active">已生效</span>',
      '解析失败': '<span class="badge-status disabled">解析失败</span>'
    };
    const hitCount = item.hitCount30d > 0
      ? '<span class="num-highlight" style="cursor:pointer;" onclick="openHitDetailModal(' + realIdx + ')">' + item.hitCount30d + '</span>'
      : '<span style="color:#999;">0</span>';
    const actions = isFaq ? getFaqActions(item, realIdx) : getDocActions(item, realIdx);
    return '<tr>' +
      '<td>' + typeBadge + '</td>' +
      '<td><div style="font-weight:500;">' + title + '</div></td>' +
      '<td style="font-size:12px;color:#666;">' + summary + '</td>' +
      '<td>' + similarCount + '</td>' +
      '<td>' + item.customer + '</td>' +
      '<td>' + item.venue + '</td>' +
      '<td style="font-size:12px;">' + (item.source === '未命中问题转入' ? item.source : item.source) + '</td>' +
      '<td>' + statusMap[item.status] + '</td>' +
      '<td>' + hitCount + '</td>' +
      '<td style="font-size:12px;color:#666;">' + item.creator + '<br>' + item.createTime + '</td>' +
      '<td>' + actions + '</td>' +
      '</tr>';
  }).join('');
  document.getElementById('kbTotalCount').textContent = list.length;
}

function getFaqActions(item, idx) {
  var moreItems = '<div class="more-menu-item" onclick="openFaqFormModal(' + idx + ')">编辑</div>';
  if (item.status === '解析失败') moreItems += '<div class="more-menu-item" onclick="retryParse(' + idx + ')">重新解析</div>';
  moreItems += '<div class="more-menu-item danger" onclick="confirmDeleteKb(' + idx + ')">删除</div>';
  return '<button class="action-btn" data-anno="test-02" onclick="openKbDetailModal(' + idx + ')">详情</button> <span class="more-menu-wrap"><button class="action-btn" onclick="toggleMoreMenu(event,' + idx + ')" data-anno="kb-more-menu">更多 ▾</button><div class="more-menu" id="moreMenu' + idx + '">' + moreItems + '</div></span>';
}

function getDocActions(item, idx) {
  var moreItems = '<div class="more-menu-item" onclick="showToast(\'文档下载中...\')">下载</div>';
  if (item.status === '解析失败') moreItems += '<div class="more-menu-item" onclick="retryParse(' + idx + ')">重新解析</div>';
  moreItems += '<div class="more-menu-item danger" onclick="confirmDeleteKb(' + idx + ')">删除</div>';
  return '<button class="action-btn" onclick="openKbDetailModal(' + idx + ')">详情</button> <span class="more-menu-wrap"><button class="action-btn" onclick="toggleMoreMenu(event,' + idx + ')">更多 ▾</button><div class="more-menu" id="moreMenu' + idx + '">' + moreItems + '</div></span>';
}

let currentEditKbIdx = -1;

function openFaqFormModal(idx) {
  currentEditKbIdx = idx !== undefined ? idx : -1;
  const isEdit = idx !== undefined;
  document.getElementById('faqFormTitle').textContent = isEdit ? '编辑问答' : '新增问答';
  if (isEdit) {
    const item = kbData[idx];
    document.getElementById('faqFormCustomer').value = item.customer;
    document.getElementById('faqFormVenue').value = item.venue;
    document.getElementById('faqFormQuestion').value = item.standardQuestion;
    document.getElementById('faqFormSimilar').value = item.similarQuestions.join('\n');
    document.getElementById('faqFormAnswer').value = item.answer || '';
    document.getElementById('faqFormKbType').value = item.kbType || 'venue';
  } else {
    document.getElementById('faqFormCustomer').value = '';
    document.getElementById('faqFormVenue').value = '';
    document.getElementById('faqFormQuestion').value = '';
    document.getElementById('faqFormSimilar').value = '';
    document.getElementById('faqFormAnswer').value = '';
    document.getElementById('faqFormKbType').value = 'venue';
  }
  onFaqKbTypeChange();
  document.getElementById('faqFormModal').classList.add('show');
}

function closeFaqFormModal() { document.getElementById('faqFormModal').classList.remove('show'); }

function onFaqKbTypeChange() {
  var kbType = document.getElementById('faqFormKbType').value;
  var venueRow = document.getElementById('faqFormVenueRow');
  venueRow.style.display = kbType === 'public' ? 'none' : '';
}
function onDocKbTypeChange() {
  var kbType = document.getElementById('docUploadKbType').value;
  var venueRow = document.getElementById('docUploadVenueRow');
  venueRow.style.display = kbType === 'public' ? 'none' : '';
}
function submitFaqForm() {
  const customer = document.getElementById('faqFormCustomer').value;
  const question = document.getElementById('faqFormQuestion').value.trim();
  const answer = document.getElementById('faqFormAnswer').value.trim();
  const kbType = document.getElementById('faqFormKbType').value;
  if (!customer) { showToast('请选择所属客户', 'warn'); return; }
  if (kbType === 'venue' && !document.getElementById('faqFormVenue').value) { showToast('请选择所属场馆', 'warn'); return; }
  if (!question) { showToast('请输入标准问题', 'warn'); return; }
  if (!answer) { showToast('请输入答案内容', 'warn'); return; }
  closeFaqFormModal();
  if (currentEditKbIdx >= 0) {
    kbData[currentEditKbIdx].status = '解析中';
    kbData[currentEditKbIdx].standardQuestion = question;
    kbData[currentEditKbIdx].answer = answer;
    kbData[currentEditKbIdx].kbType = kbType;
    kbData[currentEditKbIdx].updateTime = new Date().toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\\//g, '-');
  } else {
    kbData.push({
      id: 'kb_' + (1032 + kbData.length), type: 'faq',
      standardQuestion: question,
      similarQuestions: document.getElementById('faqFormSimilar').value.split('\n').filter(x => x.trim()),
      answer: answer,
      customer: customer,
      venue: kbType === 'public' ? '公共知识库' : document.getElementById('faqFormVenue').value,
      kbType: kbType,
      tags: [],
      source: '人工新增', sourceGroupId: null,
      status: '解析中', difySyncError: null,
      hitCount30d: 0, creator: '当前用户',
      createTime: new Date().toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g, '-'),
      updater: '当前用户',
      updateTime: new Date().toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g, '-')
    });
  }
  renderKbTable();
  showToast(currentEditKbIdx >= 0 ? '问答已更新，正在重新同步Dify' : '提交成功，知识正在同步至Dify', 'success');
}

function openDocUploadModal() { document.getElementById('docUploadModal').classList.add('show'); }

function submitDocUpload() {
  const customer = document.getElementById('docUploadCustomer').value;

}

function retryParse(idx) {
  kbData[idx].status = '解析中';
  kbData[idx].difySyncError = null;
  renderKbTable();
  showToast('正在重新解析...', 'success');
}

let deleteKbIdx = -1;
function confirmDeleteKb(idx) {
  deleteKbIdx = idx;
  document.getElementById('deleteKbConfirm').classList.add('show');
}
function closeDeleteKbConfirm() { document.getElementById('deleteKbConfirm').classList.remove('show'); }
function doDeleteKb() {
  const item = kbData[deleteKbIdx];
  kbData.splice(deleteKbIdx, 1);
  closeDeleteKbConfirm();
  renderKbTable();
  showToast('「' + (item.standardQuestion || item.documentName) + '」已删除', 'success');
}

function toggleMoreMenu(e, idx) {
  e.stopPropagation();
  document.querySelectorAll('.more-menu.show').forEach(function(m) { m.classList.remove('show'); });
  var menu = document.getElementById('moreMenu' + idx);
  if (menu) menu.classList.toggle('show');
}

function closeMoreMenus() {
  document.querySelectorAll('.more-menu.show').forEach(function(m) { m.classList.remove('show'); });
}
document.addEventListener('click', closeMoreMenus);

  var typeTag = isFaq
    ? '<span class="badge-status" style="background:#e6f7ff;color:#0B5DEA;border:1px solid #91d5ff;">问答</span>'
    : '<span class="badge-status" style="background:#f9f0ff;color:#722ed1;border:1px solid #d3adf7;">文档</span>';
  var title = isFaq ? item.standardQuestion : item.documentName;
  var statusBadge = {'解析中':'<span class="badge-status" style="background:#f5f5f5;color:#999;border:1px solid #e8e8e8;">解析中</span>','已生效':'<span class="badge-status active">已生效</span>','解析失败':'<span class="badge-status disabled">解析失败</span>'}[item.status];
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">' + typeTag + '<span style="font-weight:600;font-size:15px;">' + title + '</span> ' + statusBadge + '</div>';
  html += '<div class="info-grid" style="margin-bottom:12px;">';
  html += '<div class="info-item"><span class="info-label">所属客户：</span><span class="info-value">' + item.customer + '</span></div>';
  html += '<div class="info-item"><span class="info-label">所属场馆：</span><span class="info-value">' + item.venue + '</span></div>';
  if (isFaq) {
    html += '<div class="info-item"><span class="info-label">创建人：</span><span class="info-value">' + item.creator + '  ' + item.createTime + '</span></div>';
    html += '<div class="info-item"><span class="info-label">最近编辑：</span><span class="info-value">' + item.updater + '  ' + item.updateTime + '</span></div>';
  } else {
    html += '<div class="info-item"><span class="info-label">上传人：</span><span class="info-value">' + item.creator + '  ' + item.createTime + '</span></div>';
    html += '<div class="info-item"><span class="info-label">文件格式：</span><span class="info-value">' + (item.documentName || '').split('.').pop().toUpperCase() + '</span></div>';
    html += '<div class="info-item"><span class="info-label">文件大小：</span><span class="info-value">' + item.fileSize + '</span></div>';
  }
  html += '<div class="info-item"><span class="info-label">近30天命中：</span><span class="info-value">' + item.hitCount30d + '次</span></div>';
  html += '</div>';
  if (isFaq) {
    html += '<div style="border-top:1px solid #f0f0f0;padding-top:12px;">';
    html += '<div style="font-weight:500;color:#333;margin-bottom:6px;">标准问题</div>';
    html += '<div style="color:#666;margin-bottom:12px;">' + item.standardQuestion + '</div>';
    html += '<div style="font-weight:500;color:#333;margin-bottom:6px;">相似问法（' + item.similarQuestions.length + '）</div>';
    html += '<div style="color:#666;margin-bottom:12px;">' + item.similarQuestions.map(function(q){return '· ' + q}).join('<br>') + '</div>';
    html += '<div style="font-weight:500;color:#333;margin-bottom:6px;">答案内容</div>';
    html += '<div style="color:#666;">' + (item.answer || '—') + '</div>';
    html += '</div>';
    if (item.source === '未命中问题转入') {
      html += '<div style="border-top:1px solid #f0f0f0;padding-top:12px;margin-top:12px;">';
      html += '<div style="font-weight:500;color:#333;cursor:pointer;" onclick="var el=this.nextElementSibling;el.style.display=el.style.display===\'none\'?\'\':\'none\';this.querySelector(\'span\').textContent=el.style.display===\'none\'?\'展开 ▾\':\'收起 ▴\'">知识来源（3条未命中问题沉淀而来） <span style="color:#0B5DEA;font-size:12px;">展开 ▾</span></div>';
      html += '<div style="display:none;margin-top:8px;background:#fafafa;border-radius:6px;padding:10px;font-size:12px;color:#666;line-height:2;">';
      html += '· 有没有停车场，怎么收费 王五 07-06 转入<br>';
      html += '· 车停在哪里 张三 07-05 转入<br>';
      html += '· 停车多少钱一小时 李四 07-04 合并';
      html += '</div></div>';
    }
  } else {
    html += '<div style="border-top:1px solid #f0f0f0;padding-top:12px;color:#666;font-size:13px;">此知识条目为文档类型，可下载原文件查看内容。</div>';
  }
  if (item.status === '解析失败' && item.difySyncError) {
    html += '<div style="background:#fff2f0;border:1px solid #ffccc7;border-radius:6px;padding:8px 12px;margin-top:12px;color:#ff4d4f;font-size:12px;">' + item.difySyncError + '</div>';
  }
  document.getElementById('kbDetailBody').innerHTML = html;
  var btnHtml = '';
  if (isFaq) {
    btnHtml = '<button class="confirm-btn" onclick="closeKbDetailModal()">关闭</button> <button class="confirm-btn export-btn-confirm" onclick="closeKbDetailModal();openFaqFormModal(' + idx + ')">编辑</button>';
  } else {
    btnHtml = '<button class="confirm-btn" onclick="showToast(\'文档下载中...\')">下载原文件</button> <button class="confirm-btn" onclick="retryParse(' + idx + ');closeKbDetailModal()">重新解析</button> <button class="confirm-btn" onclick="closeKbDetailModal()">关闭</button>';
  }
  document.getElementById('kbDetailFooter').innerHTML = btnHtml;
  document.getElementById('kbDetailModal').classList.add('show');
}

function closeKbDetailModal() { document.getElementById('kbDetailModal').classList.remove('show'); }

function init_kb_management() {
  renderKbTable();
}
</script>
