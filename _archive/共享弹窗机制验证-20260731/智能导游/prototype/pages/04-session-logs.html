function renderSessionLogs(filteredData) {
  const data = filteredData || allSessionLogs;
  const tbody = document.getElementById('sessionLogBody');
  tbody.innerHTML = data.map(s => {
    const tagClass = s.quality;
    const tagText = s.quality === 'good' ? '优质' : s.quality === 'warn' ? '一般' : '需关注';
    return `<tr>
      <td><span style="color:#0B5DEA;font-weight:500;">${s.id}</span></td>
      <td>${s.user}</td>
      <td>${s.customer}</td>
      <td>${s.venue}</td>
      <td><span style="font-size:13px;">${s.agent}</span></td>
      <td>${s.time}</td>
      <td>${s.rounds} 轮</td>
      <td style="color:${s.fallback > 0 ? '#faad14' : '#52c41a'};">${s.fallback} 次</td>
      <td><span class="session-tag ${tagClass}">${tagText}</span></td>
      <td><button class="action-btn" onclick="openSessionDetail(${s.id})" data-anno="log-03">详情</button></td>
    </tr>`;
  }).join('');
  document.getElementById('logTotalCount').textContent = data.length;
}

function filterSessionLogs() {
  const customer = document.getElementById('logFilterCustomer').value;
  const venue = document.getElementById('logFilterVenue').value;
  const userQ = document.getElementById('logFilterUser').value.trim().toLowerCase();
  const start = document.getElementById('logFilterStart').value;
  const end = document.getElementById('logFilterEnd').value;
  const quality = document.getElementById('logFilterQuality').value;

  let filtered = allSessionLogs.filter(s => {
    if (customer && s.customer !== customer) return false;
    if (venue && s.venue !== venue) return false;
    if (userQ && !s.user.toLowerCase().includes(userQ) && !s.phone.includes(userQ)) return false;
    if (start && s.time < start) return false;
    if (end && s.time > end + ' 23:59') return false;
    if (quality && s.quality !== quality) return false;
    return true;
  });
  renderSessionLogs(filtered);
  showToast('筛选完成，共 ' + filtered.length + ' 条', 'success');
}

function resetLogFilter() {
  document.getElementById('logFilterCustomer').value = '';
  document.getElementById('logFilterVenue').value = '';
  document.getElementById('logFilterUser').value = '';
  document.getElementById('logFilterStart').value = '2026-04-17';
  document.getElementById('logFilterEnd').value = '2026-07-09';
  document.getElementById('logFilterQuality').value = '';
  renderSessionLogs();
  showToast('已重置筛选');
}

function openSessionDetail(sessionId) {
  const s = allSessionLogs.find(x => x.id === sessionId);
  if (!s) return;

  document.getElementById('sessionDetailTitle').textContent = '会话详情';
  document.getElementById('sessionMetaRow').innerHTML = `
    <div class="session-meta-row" style="border:none;padding:0;">
      <div><span class="label">用户：</span><span class="value">${s.user}</span></div>
      <div><span class="label">来源客户：</span><span class="value">${s.customer}</span></div>
      <div><span class="label">来源场馆：</span><span class="value">${s.venue}</span></div>
      <div><span class="label">开始时间：</span><span class="value">${s.time}</span></div>
      <div><span class="label">消息轮次：</span><span class="value">${s.rounds} 轮</span></div>
      <div><span class="label">兜底次数：</span><span class="value" style="color:${s.fallback > 0 ? '#faad14' : '#52c41a'};">${s.fallback} 次</span></div>
    </div>
  `;

  const chatWrap = document.getElementById('sessionChatWrap');
  chatWrap.innerHTML = '';
  let lastTime = '';
  s.messages.forEach(m => {
    const timeStr = m.time;
    if (timeStr !== lastTime) {
      const timeDiv = document.createElement('div');
      timeDiv.className = 'session-chat-time';
      timeDiv.textContent = s.time.split(' ')[0] + ' ' + timeStr;
      chatWrap.appendChild(timeDiv);
      lastTime = timeStr;
    }
    const msgDiv = document.createElement('div');
    msgDiv.className = 'session-chat-msg ' + (m.role === 'user' ? 'user' : 'ai');
    const avatarClass = m.role === 'user' ? 'user' : 'ai';
    const avatarText = m.role === 'user' ? '👤' : 'AI';
    msgDiv.innerHTML = `
      <div class="session-chat-avatar ${avatarClass}">${avatarText}</div>
      <div class="session-chat-bubble ${m.role}">${m.text.replace(/\n/g, '<br>')}</div>
    `;
    chatWrap.appendChild(msgDiv);
  });

  document.getElementById('sessionDetailModal').classList.add('show');
}

function closeSessionDetail() { document.getElementById('sessionDetailModal').classList.remove('show'); }

function jumpToSessionByTime(time, customer) {
  const match = allSessionLogs.find(s => s.time.startsWith(time.split(' ')[0]) && s.time.includes(time.split(' ')[1]) && s.customer === customer);
  if (match) {
    jumpToSessionLog(match.id);
  } else {
    closeUserDetail();
    switchPage('sessionLogs');
    showToast('未找到精确匹配的会话，已打开会话记录页');
  }
}

function jumpToSessionLog(sessionId) {
  closeUserDetail();
  switchPage('sessionLogs');
  setTimeout(() => openSessionDetail(sessionId), 300);
}

function openSessionExportModal() { document.getElementById('sessionExportModal').classList.add('show'); }

function closeSessionExportModal() { document.getElementById('sessionExportModal').classList.remove('show'); }

function doSessionExport() {
  const customer = document.getElementById('sessionExportCustomer').value;
  const quality = document.getElementById('sessionExportQuality').value;
  let desc = '正在导出会话记录';
  if (customer) desc += `（${customer}）`;
  if (quality) desc += `（${quality === 'good' ? '优质' : quality === 'warn' ? '一般' : '需关注'}）`;
  closeSessionExportModal();
  showToast(desc + '...', 'success');
}

  '科技馆': ['主馆'],
  '自然博物馆': ['主馆']

function onLogFilterCustomerChange() {
  var customer = document.getElementById('logFilterCustomer').value;
  var venueSelect = document.getElementById('logFilterVenue');
  venueSelect.innerHTML = '<option value="">全部场馆</option>';
  if (customer && customerVenuesMap[customer]) {
    customerVenuesMap[customer].forEach(function(name) {
      venueSelect.innerHTML += '<option>' + name + '</option>';
    });
  }
}

function init_session_logs() {
  renderSessionLogs();
}
